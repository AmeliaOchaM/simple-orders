AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Simple Orders - pencatatan pesanan kantin.
  Browser -> Lambda Function URL -> OrdersFn -> DynamoDB "orders".
  Tabel dibuat oleh Lambda TableCreator (Custom Resource), karena user sandbox
  tidak boleh CreateTable langsung.

Parameters:
  TableName:
    Type: String
    Default: orders
    Description: Nama tabel DynamoDB untuk menyimpan pesanan.
  CodeBucket:
    Type: String
    Description: Bucket S3 tempat zip kode (folder src/) diunggah.
  CodeKey:
    Type: String
    Description: Nama objek (key) zip kode di bucket S3. Dipakai kedua Lambda.
  KeyPelanggan:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Kunci API untuk role pelanggan (rahasia).
  KeyPenjual:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Kunci API untuk role penjual (rahasia).

Resources:
  # ---------------------------------------------------------------------------
  # Lambda kecil yang membuat (dan menghapus) tabel DynamoDB.
  # Memakai role bawaan LabRole karena kita tidak bisa membuat IAM role.
  # Kode dari zip yang sama dengan OrdersFn: src/handlers/setupDatabase.js
  # ---------------------------------------------------------------------------
  TableCreatorFn:
    Type: AWS::Lambda::Function
    Properties:
      Description: Membuat tabel DynamoDB untuk Simple Orders (Custom Resource).
      Runtime: nodejs22.x
      Handler: handlers/setupDatabase.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 120
      MemorySize: 128
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey

  # ---------------------------------------------------------------------------
  # Custom Resource: meminta TableCreatorFn membuat tabel.
  # !Ref OrdersTable menghasilkan nama tabel (PhysicalResourceId).
  # ---------------------------------------------------------------------------
  OrdersTable:
    Type: Custom::DynamoDBTable
    Properties:
      ServiceToken: !GetAtt TableCreatorFn.Arn
      TableName: !Ref TableName

  # ---------------------------------------------------------------------------
  # Lambda utama: API pesanan + halaman web. Log otomatis ke CloudWatch.
  # Kode: src/index.js (zip yang sama dengan TableCreatorFn).
  # ---------------------------------------------------------------------------
  OrdersFn:
    Type: AWS::Lambda::Function
    Properties:
      Description: API Simple Orders dan halaman web.
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 10
      MemorySize: 256
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
          KEY_PELANGGAN: !Ref KeyPelanggan
          KEY_PENJUAL: !Ref KeyPenjual

  # Function URL publik (tanpa IAM auth). Keamanan ditangani oleh X-Api-Key.
  OrdersFnUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt OrdersFn.Arn
      AuthType: NONE

  # Izin 1/2: siapa pun boleh memanggil Function URL.
  OrdersFnUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OrdersFn
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # Izin 2/2: pemanggilan fungsi, tapi hanya bila lewat Function URL.
  OrdersFnInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OrdersFn
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  FunctionUrl:
    Description: URL aplikasi (halaman web + API).
    Value: !GetAtt OrdersFnUrl.FunctionUrl
  TableName:
    Description: Nama tabel DynamoDB pesanan.
    Value: !Ref OrdersTable
  TableArn:
    Description: ARN tabel DynamoDB pesanan.
    Value: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OrdersTable}
