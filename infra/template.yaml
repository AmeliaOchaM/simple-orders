AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Simple Orders - pencatatan pesanan kantin.
  Browser -> Lambda Function URL -> OrdersFn -> DynamoDB "orders".
  Tabel dibuat oleh Lambda TableCreator (Custom Resource), karena user sandbox
  tidak boleh CreateTable langsung.

Parameters:
  TableName:
    Type: String
    Default: orders
    Description: Nama tabel DynamoDB untuk menyimpan pesanan.
  CodeBucket:
    Type: String
    Description: Bucket S3 tempat zip kode OrdersFn diunggah.
  CodeKey:
    Type: String
    Description: Nama objek (key) zip kode OrdersFn di bucket S3.
  KeyPelanggan:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Kunci API untuk role pelanggan (rahasia).
  KeyPenjual:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Kunci API untuk role penjual (rahasia).

Resources:
  # ---------------------------------------------------------------------------
  # Lambda kecil yang membuat (dan menghapus) tabel DynamoDB.
  # Memakai role bawaan LabRole karena kita tidak bisa membuat IAM role.
  # Kode ditulis inline (ZipFile) supaya tidak perlu diunggah ke S3.
  # ---------------------------------------------------------------------------
  TableCreatorFn:
    Type: AWS::Lambda::Function
    Properties:
      Description: Membuat tabel DynamoDB untuk Simple Orders (Custom Resource).
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 120
      MemorySize: 128
      Code:
        ZipFile: |
          // TableCreator: dipanggil CloudFormation saat Create/Update/Delete.
          const https = require('https');
          const {
            DynamoDBClient, CreateTableCommand, DeleteTableCommand, waitUntilTableExists
          } = require('@aws-sdk/client-dynamodb');
          const db = new DynamoDBClient({});

          // Kirim hasil (SUCCESS/FAILED) ke CloudFormation lewat URL S3 bertanda tangan.
          function kirim(event, context, status, idFisik, alasan) {
            const body = JSON.stringify({
              Status: status,
              Reason: alasan || 'Lihat log CloudWatch: ' + context.logStreamName,
              PhysicalResourceId: idFisik,
              StackId: event.StackId,
              RequestId: event.RequestId,
              LogicalResourceId: event.LogicalResourceId
            });
            return new Promise((resolve) => {
              const req = https.request(event.ResponseURL, {
                method: 'PUT',
                headers: { 'Content-Type': '', 'Content-Length': Buffer.byteLength(body) }
              }, (res) => { res.resume(); res.on('end', resolve); });
              req.on('error', (e) => { console.error('Gagal kirim respons:', e.message); resolve(); });
              req.end(body);
            });
          }

          exports.handler = async (event, context) => {
            console.log('Permintaan:', event.RequestType, event.LogicalResourceId);
            const nama = event.ResourceProperties.TableName;
            try {
              if (event.RequestType === 'Delete') {
                // Stack dihapus: hapus tabel. Abaikan jika tabel sudah tidak ada.
                try {
                  await db.send(new DeleteTableCommand({ TableName: event.PhysicalResourceId }));
                } catch (e) {
                  if (e.name !== 'ResourceNotFoundException') throw e;
                }
                return await kirim(event, context, 'SUCCESS', event.PhysicalResourceId);
              }

              // Create/Update: buat tabel jika belum ada (idempoten).
              try {
                await db.send(new CreateTableCommand({
                  TableName: nama,
                  BillingMode: 'PAY_PER_REQUEST',
                  AttributeDefinitions: [{ AttributeName: 'orderId', AttributeType: 'S' }],
                  KeySchema: [{ AttributeName: 'orderId', KeyType: 'HASH' }]
                }));
              } catch (e) {
                if (e.name !== 'ResourceInUseException') throw e;
                console.log('Tabel sudah ada, dipakai ulang:', nama);
              }
              // Tunggu sampai tabel ACTIVE sebelum melapor sukses.
              await waitUntilTableExists({ client: db, maxWaitTime: 90 }, { TableName: nama });
              await kirim(event, context, 'SUCCESS', nama);
            } catch (e) {
              console.error('Gagal:', e.name, e.message);
              await kirim(event, context, 'FAILED', event.PhysicalResourceId || nama, e.name + ': ' + e.message);
            }
          };

  # ---------------------------------------------------------------------------
  # Custom Resource: meminta TableCreatorFn membuat tabel.
  # !Ref OrdersTable menghasilkan nama tabel (PhysicalResourceId).
  # ---------------------------------------------------------------------------
  OrdersTable:
    Type: Custom::DynamoDBTable
    Properties:
      ServiceToken: !GetAtt TableCreatorFn.Arn
      TableName: !Ref TableName

  # ---------------------------------------------------------------------------
  # Lambda utama: API pesanan + halaman web. Log otomatis ke CloudWatch.
  # ---------------------------------------------------------------------------
  OrdersFn:
    Type: AWS::Lambda::Function
    Properties:
      Description: API Simple Orders dan halaman web.
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 10
      MemorySize: 256
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
          KEY_PELANGGAN: !Ref KeyPelanggan
          KEY_PENJUAL: !Ref KeyPenjual

  # Function URL publik (tanpa IAM auth). Keamanan ditangani oleh X-Api-Key.
  OrdersFnUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt OrdersFn.Arn
      AuthType: NONE

  # Izin 1/2: siapa pun boleh memanggil Function URL.
  OrdersFnUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OrdersFn
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # Izin 2/2: pemanggilan fungsi, tapi hanya bila lewat Function URL.
  OrdersFnInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OrdersFn
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  FunctionUrl:
    Description: URL aplikasi (halaman web + API).
    Value: !GetAtt OrdersFnUrl.FunctionUrl
  TableName:
    Description: Nama tabel DynamoDB pesanan.
    Value: !Ref OrdersTable
  TableArn:
    Description: ARN tabel DynamoDB pesanan.
    Value: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OrdersTable}
