AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Simple Orders - pencatatan pesanan kantin.
  Browser -> Lambda Function URL -> OrdersFn -> DynamoDB "orders".
  Stack ini hanya membuat fungsi dengan kode placeholder. Kode asli (folder src/)
  diunggah scripts/deploy.sh lewat "aws lambda update-function-code", dan tabel
  dibuat lewat "aws lambda invoke" dengan action setupDatabase.

Parameters:
  KeyPembeli:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Kunci API untuk pembeli (rahasia).

Resources:
  # ---------------------------------------------------------------------------
  # Lambda utama: API pesanan, halaman web, dan pengelola tabel (action).
  # Memakai role bawaan LabRole karena kita tidak bisa membuat IAM role.
  # Log otomatis ke CloudWatch.
  # ---------------------------------------------------------------------------
  OrdersFn:
    Type: AWS::Lambda::Function
    Properties:
      Description: API Simple Orders dan halaman web.
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 60 # cukup untuk menunggu tabel ACTIVE saat action setupDatabase
      MemorySize: 256
      Code:
        ZipFile: |
          // Placeholder. Kode asli (folder src/) diunggah oleh scripts/deploy.sh.
          exports.handler = async () => ({
            statusCode: 503,
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ error: 'Kode belum diunggah. Jalankan scripts/deploy.sh' }),
          });
      Environment:
        Variables:
          TABLE_NAME: orders
          KEY_PEMBELI: !Ref KeyPembeli

  # Function URL publik (tanpa IAM auth). Keamanan ditangani oleh X-Api-Key.
  OrdersFnUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt OrdersFn.Arn
      AuthType: NONE

  # Izin 1/2: siapa pun boleh memanggil Function URL.
  OrdersFnUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OrdersFn
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # Izin 2/2: pemanggilan fungsi, tapi hanya bila lewat Function URL.
  # (Invoke langsung untuk action setupDatabase tetap butuh kredensial AWS.)
  OrdersFnInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OrdersFn
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  FunctionUrl:
    Description: URL aplikasi (halaman web + API).
    Value: !GetAtt OrdersFnUrl.FunctionUrl
  FunctionName:
    Description: Nama fungsi Lambda (untuk update-function-code dan invoke).
    Value: !Ref OrdersFn
