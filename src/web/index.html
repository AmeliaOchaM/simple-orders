<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Orders</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wadah">
    <header>
      <h1>Simple Orders</h1>
      <p class="sub">Pencatatan pesanan kantin</p>
    </header>

    <!-- Akses: kunci API dikirim sebagai header X-Api-Key -->
    <section class="kartu">
      <h2>Akses</h2>
      <label>Kunci API
        <input id="kunci" type="password" autocomplete="off" placeholder="Tempel kunci API">
      </label>
    </section>

    <section class="kartu">
      <h2>Buat pesanan</h2>
      <form id="form-buat">
        <label>Nama pemesan
          <input id="buat-nama" maxlength="100" required>
        </label>
        <div class="grid">
          <label>Menu
            <input id="buat-menu" maxlength="100" required>
          </label>
          <label>Jumlah
            <input id="buat-jumlah" type="number" min="1" step="1" value="1" required>
          </label>
        </div>
        <button type="submit">Buat pesanan</button>
      </form>
    </section>

    <section class="kartu">
      <h2>Cek pesanan</h2>
      <form id="form-cek" class="sebaris">
        <input id="cek-id" placeholder="ID pesanan" required>
        <button type="submit">Cek</button>
      </form>
    </section>

    <!-- Hasil / pesan error dari API. Tombol aksi muncul setelah "Cek" berhasil. -->
    <section class="kartu">
      <h2>Hasil</h2>
      <div id="hasil" class="hasil" aria-live="polite">Belum ada permintaan.</div>
      <div id="aksi-pesanan" class="aksi" hidden>
        <button id="btn-selesai" type="button">Tandai diterima</button>
        <button id="btn-hapus" type="button" class="bahaya">Batalkan</button>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
